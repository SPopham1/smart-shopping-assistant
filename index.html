<!DOCTYPE html><html lang="en"> <head><meta charset="utf-8"><link rel="stylesheet" href="/_astro/index.K-HmnvKv.css"></head> <body class="bg-gray-50 text-gray-900 min-h-screen">  <header class="bg-white border-b border-gray-200"> <!-- FULL WIDTH BAR --> <div class="w-full px-4 md:px-6 lg:px-10 xl:px-16"> <!-- CONTENT WIDTH CONTROL --> <div class="max-w-screen-xl mx-auto flex items-center justify-between py-4"> <!-- Left --> <div class="flex items-center gap-8"> <a href="/" class="text-xl font-bold text-green-700"> SmartShop </a> <nav class="hidden md:flex gap-6 text-gray-700"> <a href="#" class="hover:text-green-700">
Groceries
</a> <a href="#" class="hover:text-green-700">
My list
</a> <a href="#" class="hover:text-green-700">
Help
</a> </nav> </div> <!-- Right --> <div class="flex items-center gap-3"> <a id="accountBtn" href="/login" class="btn-primary"> Account </a> <button id="logoutBtn" class="btn-secondary hidden"> Log out </button> </div> </div> </div> <script type="module">
    import {
      onAuthStateChanged,
      signOut,
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { auth } from "/firebase.js";

    const logoutBtn = document.getElementById("logoutBtn");
    const accountBtn = document.getElementById("accountBtn");

    onAuthStateChanged(auth, (user) => {
      if (user) {
        logoutBtn.classList.remove("hidden");
        accountBtn.classList.add("hidden");
      } else {
        logoutBtn.classList.add("hidden");
        accountBtn.classList.remove("hidden");
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = import.meta.env.BASE_URL + "login";
    });
  </script> </header> <main class="container text-center py-12 md:py-16 lg:py-20"> <h1 class="text-4xl md:text-5xl font-bold mb-4">
Plan your shop. Walk less.
</h1> <p class="text-lg text-gray-600 max-w-xl mx-auto mb-6">
Create a shopping list and get the most efficient in-store route.
</p> <a href="#" class="btn-primary inline-block"> Create shopping list </a> </main> <script type="module">
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { auth } from "/firebase.js";

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = import.meta.env.BASE_URL + "login";
      }
    });
  </script>  </body></html>
