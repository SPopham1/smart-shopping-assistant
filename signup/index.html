<!DOCTYPE html><html lang="en"> <head><meta charset="utf-8"><link rel="stylesheet" href="/_astro/index.K-HmnvKv.css"></head> <body class="bg-gray-50 text-gray-900 min-h-screen">  <header class="bg-white border-b border-gray-200"> <!-- FULL WIDTH BAR --> <div class="w-full px-4 md:px-6 lg:px-10 xl:px-16"> <!-- CONTENT WIDTH CONTROL --> <div class="max-w-screen-xl mx-auto flex items-center justify-between py-4"> <!-- Left --> <div class="flex items-center gap-8"> <a href="/" class="text-xl font-bold text-green-700"> SmartShop </a>  </div> <!-- Right --> <div class="flex items-center gap-3"> <a id="accountBtn" href="/login" class="btn-primary"> Account </a> <button id="logoutBtn" class="btn-secondary hidden"> Log out </button> </div> </div> </div> <script type="module">
    import {
      onAuthStateChanged,
      signOut,
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { auth } from "/firebase.js";

    const logoutBtn = document.getElementById("logoutBtn");
    const accountBtn = document.getElementById("accountBtn");

    onAuthStateChanged(auth, (user) => {
      if (user) {
        logoutBtn.classList.remove("hidden");
        accountBtn.classList.add("hidden");
      } else {
        logoutBtn.classList.add("hidden");
        accountBtn.classList.remove("hidden");
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = import.meta.env.BASE_URL + "login";
    });
  </script> </header> <main class="container flex justify-center py-12"> <div class="card w-full max-w-md"> <h2 class="text-2xl font-semibold mb-6 text-center">Create an account</h2> <form id="signupForm" class="space-y-4"> <div> <label class="block text-sm font-medium text-gray-700 mb-1">
Email
</label> <input type="email" required class="input"> </div> <div> <label class="block text-sm font-medium text-gray-700 mb-1">
Password
</label> <input type="password" minlength="6" required class="input"> </div> <button type="submit" class="btn-primary w-full"> Sign up </button> </form> <p class="text-sm text-center text-gray-600 mt-4">
Already have an account?
<a href="/login" class="text-green-700 font-medium hover:underline">
Log in
</a> </p> </div> </main> <script type="module">
    import { signup } from "/auth.js";

    const form = document.getElementById("signupForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = form.querySelector('input[type="email"]').value;
      const password = form.querySelector('input[type="password"]').value;

      try {
        await signup(email, password);
        window.location.href = import.meta.env.BASE_URL;
      } catch (err) {
        alert(err.message);
        console.error(err);
      }
    });

    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { auth } from "/firebase.js";

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = import.meta.env.BASE_URL;
      }
    });
  </script>  </body></html>
